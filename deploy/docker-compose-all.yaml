# ==================================================
# DeepTrace 完整部署配置
# 包含：DeepTrace Web + Worker + DM8 + TongRDS
# ==================================================

version: "3.8"

services:
  # ==================================================
  # 1. DM8 数据库 (达梦数据库)
  # ==================================================
  dm8:
    container_name: deeptrace-dm8
    image: dm8:dm8_20250506_rev270902_x86_rh6_64
    environment:
      # 页面大小（DM8 初始化参数，不可更改）
      - PAGE_SIZE=32
      # SYSDBA 用户密码（必须修改为强密码）
      - SYSDBA_PWD=${DM8_PASSWORD:-Deeptrace2025}
      # 实例名称
      - INSTANCE_NAME=DM8
    ports:
      # DM8 默认端口
      - "${DM8_PORT:-5236}:5236"
    volumes:
      # 数据持久化
      - dm8_data:/opt/dmdbms/data
      # 初始化脚本（容器首次启动时自动执行）
      - ./dm8_init.sql:/opt/dmdbms/init.sql
      # 种子数据（可选，包含默认用户和项目）
      - ./dm8_seed_data.sql:/opt/dmdbms/seed_data.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/dmdbms/bin/disql", "SYSDBA/${DM8_PASSWORD:-Deeptrace2025}@localhost:5236", "-E", "SELECT 1 FROM dual"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s  # DM8 启动较慢，需要等待初始化完成
    networks:
      - deeptrace-network

  # ==================================================
  # 2. TongRDS (Redis-compatible)
  # ==================================================
  tongrds:
    container_name: deeptrace-tongrds
    # 如果有 TongRDS 官方镜像，使用官方镜像
    # image: tongrds:latest
    # 否则使用 Redis 镜像作为替代（TongRDS 兼容 Redis 协议）
    image: redis:7-alpine
    ports:
      # Redis/TongRDS 默认端口
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      # 数据持久化
      - tongrds_data:/data
    # 如果 TongRDS 需要密码，使用以下命令启动
    command: >
      sh -c '
        if [ -n "$$REDIS_PASSWORD" ]; then
          redis-server --requirepass $$REDIS_PASSWORD --appendonly yes
        else
          redis-server --appendonly yes
        fi
      '
    environment:
      # TongRDS/Redis 密码（可选）
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - deeptrace-network

  # ==================================================
  # 3. DeepTrace Web 应用
  # ==================================================
  deeptrace-web:
    container_name: deeptrace-web
    build:
      context: ..
      dockerfile: Dockerfile.dm8
      args:
        - NEXT_PUBLIC_LANGFUSE_CLOUD_REGION=
        - NEXT_PUBLIC_DEMO_PROJECT_ID=
        - NEXT_PUBLIC_SIGN_UP_DISABLED=
    # 如果使用预构建镜像，注释上面的 build 并取消下面的注释
    # image: your-registry/deeptrace:latest
    ports:
      # Web 应用端口
      - "${WEB_PORT:-3000}:5000"
    environment:
      # =====================
      # 数据库配置
      # =====================
      - DB_TYPE=dm8

      # DM8 数据库连接（使用容器名称作为主机名）
      - DATABASE_URL=dm://SYSDBA:${DM8_PASSWORD:-Deeptrace2025}@dm8:5236

      # TongRDS 连接（使用容器名称作为主机名）
      - REDIS_HOST=tongrds
      - REDIS_PORT=6379
      - REDIS_AUTH=${REDIS_PASSWORD:-}

      # =====================
      # 应用配置
      # =====================
      - NEXTAUTH_URL=http://localhost:${WEB_PORT:-3000}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-langfuse-secret-change-me}
      - LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES=true

      # 端口配置
      - PORT=5000

      # =====================
      # 安全配置
      # =====================
      - SALT=${SALT:-langfuse-salt-change-me}
      - LANGFUSE_WORKER_PASSWORD=${WORKER_PASSWORD:-mybasicauthsecret}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:-8f94183ebc9cd0702323781700473ec7778adf21c7faf9a25c9c19239d936974}

      # =====================
      # 可选配置（留空）
      # =====================
      - EMAIL_FROM_ADDRESS=
      - SMTP_CONNECTION_URL=
      - S3_ENDPOINT=
      - S3_ACCESS_KEY_ID=
      - S3_SECRET_ACCESS_KEY=
      - S3_BUCKET_NAME=
      - S3_REGION=

      # 日志配置
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=production

    depends_on:
      dm8:
        condition: service_healthy
      tongrds:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - deeptrace-network

  # ==================================================
  # 4. DeepTrace Worker 服务
  # ==================================================
  deeptrace-worker:
    container_name: deeptrace-worker
    build:
      context: ..
      dockerfile: Dockerfile.dm8
    # 如果使用预构建镜像，注释上面的 build 并取消下面的注释
    # image: your-registry/deeptrace:latest
    command: ["node", "worker/dist/index.js"]
    ports:
      # Worker 服务端口
      - "${WORKER_PORT:-5001}:5001"
    environment:
      # =====================
      # 数据库配置
      # =====================
      - DB_TYPE=dm8

      # DM8 数据库连接
      - DATABASE_URL=dm://SYSDBA:${DM8_PASSWORD:-Deeptrace2025}@dm8:5236

      # TongRDS 连接
      - REDIS_HOST=tongrds
      - REDIS_PORT=6379
      - REDIS_AUTH=${REDIS_PASSWORD:-}

      # =====================
      # 应用配置
      # =====================
      - LANGFUSE_WORKER_PASSWORD=${WORKER_PASSWORD:-mybasicauthsecret}
      - NODE_ENV=production

      # 端口配置
      - PORT=5001

    depends_on:
      deeptrace-web:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - deeptrace-network

# ==================================================
# 数据卷（持久化存储）
# ==================================================
volumes:
  dm8_data:
    driver: local
  tongrds_data:
    driver: local

# ==================================================
# 网络配置
# ==================================================
networks:
  deeptrace-network:
    name: deeptrace-network
    driver: bridge
