services:
  # DM8 数据库 (达梦数据库)
  deeptrace-db-dm8:
    container_name: deeptrace-db-dm8
    image: dm8:dm8_20250506_rev270902_x86_rh6_64
    environment:
      - PAGE_SIZE=32
      - SYSDBA_PWD=Deeptrace2025
      - INSTANCE_NAME=DM8
    ports:
      - "5236:5236"
    volumes:
      - dm8_data:/opt/dmdbms/data
      - ./dm8_init.sql:/opt/dmdbms/init.sql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/opt/dmdbms/bin/disql", "SYSDBA/Deeptrace2025@localhost:5236", "-E", "SELECT 1"]
      interval: 20s
      timeout: 10s
      retries: 15
      start_period: 120s  # DM8 启动较慢，需要等待初始化完成

  # TongRDS (Redis-compatible) - 使用宿主机上运行的 TongRDS
  # 不需要单独容器，TongRDS 运行在宿主机 6379 端口

  # DeepTrace 应用
  deeptrace-app:
    container_name: deeptrace-app
    build:
      context: ..
      dockerfile: Dockerfile.dm8
    # 如果使用预构建镜像，注释上面的 build 并取消下面的注释
    # image: crpi-c5o2h95d1octk4m8.cn-hangzhou.personal.cr.aliyuncs.com/wcompass/deeptrace:1.1.0-dm8
    ports:
      - "3000:5000"  # web 前端
      - "5001:5001"  # worker 后端
    environment:
      # 数据库类型配置
      - DB_TYPE=dm8

      # DM8 数据库配置
      - DATABASE_URL=dm://SYSDBA:Deeptrace2025@deeptrace-db-dm8:5236
      - DIRECT_URL=dm://SYSDBA:Deeptrace2025@deeptrace-db-dm8:5236

      # TongRDS 配置 (Redis-compatible, 运行在宿主机)
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6379
      - REDIS_AUTH=

      # Next Auth 配置
      - NEXTAUTH_URL=http://192.168.10.148:3000
      - NEXTAUTH_SECRET=secret

      # Langfuse 配置
      - LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES=true

      # 端口配置
      - PORT=5000
      - WORKER_PORT=5001

      # 安全配置
      - SALT=salt
      - LANGFUSE_WORKER_PASSWORD=mybasicauthsecret
      - ENCRYPTION_KEY=8f94183ebc9cd0702323781700473ec7778adf21c7faf9a25c9c19239d936974

      # 可选配置（留空）
      - EMAIL_FROM_ADDRESS=
      - SMTP_CONNECTION_URL=
      - S3_ENDPOINT=
      - S3_ACCESS_KEY_ID=
      - S3_SECRET_ACCESS_KEY=
      - S3_BUCKET_NAME=
      - S3_REGION=
    depends_on:
      deeptrace-db-dm8:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  dm8_data:
