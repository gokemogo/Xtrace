services:
  deeptrace-init:
    image: deeptrace:latest
    container_name: deeptrace-init
    command: ["node", "scripts/run-init.js"]
    volumes:
      - ./deploy/dm8_init_simple.sql:/app/deploy/dm8_init_final.sql
    environment:
      - DB_TYPE=dm8
      - DATABASE_URL=dm://SYSDBA:Dm8DtUlR16LY8h0uC01zSYx@host.docker.internal:5236/SYSDBA
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  deeptrace-web:
    image: deeptrace:latest
    container_name: deeptrace-web
    ports:
      - "3000:3000"
    depends_on:
      deeptrace-init:
        condition: service_completed_successfully
    environment:
      # ============================================
      # DM8 数据库连接配置
      # 格式: dm://用户名:密码@IP地址:端口
      # ============================================
      - DB_TYPE=dm8
      - DATABASE_URL=dm://SYSDBA:Dm8DtUlR16LY8h0uC01zSYx@host.docker.internal:5236/SYSDBA

      # ============================================
      # TongRDS/Redis 配置（可选）
      # ============================================
      # - REDIS_HOST=host.docker.internal
      # - REDIS_PORT=6397
      # - REDIS_AUTH=你的密码

      # ============================================
      # 应用配置
      # ============================================
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=secret
      - LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES=true
      - SALT=salt
      - LANGFUSE_WORKER_PASSWORD=mybasicauthsecret
      - ENCRYPTION_KEY=8f94183ebc9cd0702323781700473ec7778adf21c7faf9a25c9c19239d936974
      - LOG_LEVEL=info
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  deeptrace-worker:
    image: deeptrace:latest
    container_name: deeptrace-worker
    command: ["node", "worker/dist/index.js"]
    ports:
      - "3001:3001"
    volumes:
      - ./deploy/dm8_full_init.sql:/app/deploy/dm8_full_init.sql
    environment:
      # ============================================
      # DM8 数据库连接配置
      # ============================================
      - DB_TYPE=dm8
      - DATABASE_URL=dm://SYSDBA:Dm8DtUlR16LY8h0uC01zSYx@host.docker.internal:5236/SYSDBA

      # ============================================
      # TongRDS/Redis 配置（可选）
      # ============================================
      # - REDIS_HOST=host.docker.internal
      # - REDIS_PORT=6397
      # - REDIS_AUTH=你的密码

      # ============================================
      # 应用配置
      # ============================================
      - LANGFUSE_WORKER_PASSWORD=mybasicauthsecret
      - NODE_ENV=production
      - PORT=3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      deeptrace-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: deeptrace-network
    driver: bridge
