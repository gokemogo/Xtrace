services:
  deeptrace-web:
    image: deeptrace:latest
    container_name: deeptrace-web
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/dm8_init.sql:/app/deploy/dm8_init.sql
      - ./deploy/dm8_optimization.sql:/app/deploy/dm8_optimization.sql
      - ./deploy/dm8_seed_data.sql:/app/deploy/dm8_seed_data.sql
    environment:
      - DB_TYPE=dm8
      - DATABASE_URL=dm://SYSDBA:Deeptrace2025@host.docker.internal:5236
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6397
      - REDIS_AUTH=Deeptrace@2025
      - REDIS_DB=0
      - "REDIS_KEY_PREFIX=deeptrace:"
      - REDIS_DEFAULT_TTL=60
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=secret
      - LANGFUSE_ENABLE_EXPERIMENTAL_FEATURES=true
      - SALT=salt
      - LANGFUSE_WORKER_PASSWORD=mybasicauthsecret
      - ENCRYPTION_KEY=8f94183ebc9cd0702323781700473ec7778adf21c7faf9a25c9c19239d936974
      - LOG_LEVEL=info
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://0.0.0.0:3000/api/public/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  deeptrace-worker:
    image: deeptrace:latest
    container_name: deeptrace-worker
    command: ["node", "worker/dist/index.js"]
    ports:
      - "3001:3001"
    volumes:
      - ./deploy/dm8_init.sql:/app/deploy/dm8_init.sql
      - ./deploy/dm8_optimization.sql:/app/deploy/dm8_optimization.sql
      - ./deploy/dm8_seed_data.sql:/app/deploy/dm8_seed_data.sql
    environment:
      - DB_TYPE=dm8
      - DATABASE_URL=dm://SYSDBA:Deeptrace2025@host.docker.internal:5236
      - REDIS_HOST=host.docker.internal
      - REDIS_PORT=6397
      - REDIS_AUTH=Deeptrace@2025
      - REDIS_DB=0
      - "REDIS_KEY_PREFIX=deeptrace:"
      - REDIS_DEFAULT_TTL=60
      - LANGFUSE_WORKER_PASSWORD=mybasicauthsecret
      - NODE_ENV=production
      - PORT=3001
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      deeptrace-web:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  default:
    name: deeptrace-network
    driver: bridge
